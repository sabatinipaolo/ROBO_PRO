; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = blackpill_f411ce

[common]
build_src_filter = 
	
	
	
	
	-<main.cpp> +<my_lib/> +<test/test_controller_dritto_a_0_gradi.cpp>
lib_deps = adafruit/Adafruit SSD1306@^2.5.16
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D HAS_OLED_DISPLAY
monitor_speed = 115200

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
lib_deps = 
	${common.lib_deps}
	dlloydev/QuickPID@^3.1.9
	adafruit/Adafruit QMC5883P Library@^1.0.1
monitor_speed = ${common.monitor_speed}
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-D BLACKPILL_F411CE

[env:arduino_mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	${common.lib_deps}
	dlloydev/QuickPID@^3.1.9
	adafruit/Adafruit QMC5883P Library@^1.0.1
monitor_speed = ${common.monitor_speed}
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-D ARDUINO_MEGA2560
	-D NO_PID

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = 
	${common.lib_deps}
	dlloydev/QuickPID@^3.1.9
	adafruit/Adafruit QMC5883P Library@^1.0.1
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-D ARDUINO_UNO
