lib_deps = adafruit/Adafruit SSD1306@^2.5.16
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D HAS_OLED_DISPLAY
monitor_speed = 115200

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
lib_deps = 
	${common.lib_deps}
	dlloydev/QuickPID@^3.1.9
monitor_speed = ${common.monitor_speed}
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-D BLACKPILL_F411CE

[env:arduino_mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	${common.lib_deps}
	dlloydev/QuickPID@^3.1.9
monitor_speed = ${common.monitor_speed}
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-D ARDUINO_MEGA2560

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = 
	${common.lib_deps}
	dlloydev/QuickPID@^3.1.9
build_src_filter = ${common.build_src_filter}
build_flags = 
	${common.build_flags}
	-D ARDUINO_UNO
